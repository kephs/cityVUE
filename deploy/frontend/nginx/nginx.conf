# Configuration foundation only: not a deployed private-origin boundary.
# Future packaging must supply standard mime.types and Vite output at this root.
worker_processes auto;
pid /tmp/reqro-nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/reqro-client-body;
    proxy_temp_path /tmp/reqro-proxy;
    fastcgi_temp_path /tmp/reqro-fastcgi;
    uwsgi_temp_path /tmp/reqro-uwsgi;
    scgi_temp_path /tmp/reqro-scgi;

    # Empty add_header values are omitted. No child adds/replaces header sets.
    map $uri $frontend_coop {
        default same-origin;
        ~^/redirect[.]html$ "";
    }

    map $uri $frontend_cache_class {
        default no-cache;
        ~*\.html$ no-store;
    }

    # Errors never inherit the asset cache class.
    map $status $frontend_cache {
        default no-store;
        200 $frontend_cache_class;
        206 $frontend_cache_class;
        304 $frontend_cache_class;
    }

    server {
        # Container listener; validation publishes only on host 127.0.0.1.
        # Production private ingress/admission remains a separate gate.
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        error_page 404 = @not_found;

        location @not_found {
            types { }
            default_type text/plain;
            return 404 "Not found\n";
        }

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy $frontend_coop always;
        add_header Cache-Control $frontend_cache always;

        location = /redirect.html {
            try_files $uri =404;
        }

        location = /index.html {
            try_files $uri =404;
        }

        location = /api {
            return 404;
        }

        location ^~ /api/ {
            return 404;
        }

        location = /assets {
            return 404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        # A dot in any path segment marks a file-like request, including
        # missing extensions and file/path-info. It never becomes SPA HTML.
        location ~ /[^/]*\.[^/]*(/|$) {
            try_files $uri =404;
        }

        # Extensionless navigation only, after API/static exclusions.
        # No $uri/ directory probing: fallback targets the exact index rule.
        location / {
            try_files $uri /index.html;
        }
    }
}
