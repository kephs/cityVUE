# =====================================================================
# One-shot operator container in the private VNet  --  ADR-029
# =====================================================================
#
# The agent never reaches the database. It starts an Azure Container
# Instance inside the VNet that holds the private PostgreSQL endpoint,
# waits for it, and collects its logs. The database is unreachable from
# the agent pool by design, so a compromised agent cannot connect even
# with the operator's arguments.
#
# The container authenticates to PostgreSQL with a user-assigned managed
# identity whose Entra object ID is mapped to the literal PostgreSQL role
# `reqro_operator`. No password exists, no token is ever handed to a
# human, and the token never appears in a pipeline variable: the
# container fetches it from the instance metadata endpoint itself.
#
# EXECUTION SHAPE, all asserted by the contract test:
#   - the compiled operator artifact is the entry point, never a shell;
#   - the image is pinned by immutable digest, never a tag;
#   - restart policy Never, so a failed mutation is not retried blindly;
#   - a 15-minute timeout, far below the 60-minute elevation ceiling;
#   - every trusted execution field is passed as environment, never argv.

parameters:
  - name: serviceConnection
    type: string
  - name: operation
    type: string
  - name: mode
    type: string
  - name: approvedOperation
    type: string
    default: ''
  - name: networkProfile
    type: string
  # Operation inputs. These are the only values a human chooses.
  - name: organizationId
    type: string
  - name: hostname
    type: string
  - name: domainRole
    type: string
    default: ''
  - name: expectedRevision
    type: string
    default: ''
  - name: approvalId
    type: string
    default: ''
  - name: reason
    type: string
  - name: ticket
    type: string
    default: ''
  # Trusted values, resolved by the platform in a previous step.
  - name: iamSubject
    type: string
  - name: iamOrigin
    type: string
  - name: iamOriginTenantId
    type: string
  - name: elevationRequestId
    type: string
  - name: elevationGrantedAt
    type: string
  - name: elevationExpiresAt
    type: string
  - name: requestArtifactDigest
    type: string
    default: ''
  # The artifact's bytes, base64-encoded. Delivered through the ACI
  # `--secrets` mechanism purely because that is how arbitrary file content
  # is mounted into an instance without provisioning external storage; the
  # artifact is not a credential and contains no secret. It arrives as
  # /mnt/request/request.json inside the container.
  - name: requestArtifactBase64
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    displayName: 'Run one-shot operator container (ACI, private VNet)'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        # The digest is resolved from the registry and pinned. A tag would
        # not be provenance, and the operator contract refuses one.
        digest="$(operatorImageDigest)"
        case "${digest}" in
          sha256:*) ;;
          *) echo "the operator image must be pinned by sha256 digest" >&2; exit 1 ;;
        esac

        instance="reqro-operator-$(Build.BuildId)-$(System.JobAttempt)"

        # The request artifact is mounted as a file only when one is being
        # approved. Both the mount and the digest are supplied together; the
        # operator refuses a half-supplied pair.
        artifactArgs=()
        REQRO_REQUEST_ARTIFACT_ENV=""
        if [ -n "${{ parameters.requestArtifactBase64 }}" ]; then
          artifactArgs+=(--secrets "request.json=${{ parameters.requestArtifactBase64 }}")
          artifactArgs+=(--secrets-mount-path /mnt/request)
          REQRO_REQUEST_ARTIFACT_ENV="REQRO_OPERATOR_REQUEST_ARTIFACT=/mnt/request/request.json"
        fi

        az container create \
          "${artifactArgs[@]+"${artifactArgs[@]}"}" \
          --resource-group "$(operatorResourceGroup)" \
          --name "${instance}" \
          --image "$(operatorRegistry)/reqro-operator@${digest}" \
          --restart-policy Never \
          --os-type Linux \
          --subnet "$(operatorSubnetId)" \
          --assign-identity "$(operatorManagedIdentityId)" \
          --acr-identity "$(operatorManagedIdentityId)" \
          --command-line "node dist/database/tenant-domain-operator-cli.js ${{ parameters.operation }} ${{ parameters.approvedOperation }} ${{ parameters.mode }}" \
          --environment-variables \
            NODE_ENV=production \
            CITYVUE_DEPLOYMENT_PROFILE=client \
            TENANT_RESOLUTION_STRATEGY=registry \
            DATABASE_SSL_MODE=verify-full \
            DATABASE_SSL_CA_FILE=/app/certs/postgres-ca.pem \
            REQRO_DEPLOYMENT_ENVIRONMENT="$(deploymentEnvironment)" \
            REQRO_DEPLOYMENT_SCHEMA="$(deploymentSchema)" \
            REQRO_OPERATOR_ENVIRONMENT="$(deploymentEnvironment)" \
            REQRO_OPERATOR_DATABASE="$(operatorDatabase)" \
            REQRO_OPERATOR_DATABASE_USER=reqro_operator \
            REQRO_OPERATOR_IAM_TENANT_ID="$(expectedTenantId)" \
            REQRO_OPERATOR_IAM_SUBJECT="${{ parameters.iamSubject }}" \
            REQRO_OPERATOR_IAM_ORIGIN="${{ parameters.iamOrigin }}" \
            REQRO_OPERATOR_IAM_ORIGIN_TENANT_ID="${{ parameters.iamOriginTenantId }}" \
            REQRO_OPERATOR_IAM_PERMISSIONS="$(operatorPermissions)" \
            REQRO_OPERATOR_ELEVATION_REQUEST_ID="${{ parameters.elevationRequestId }}" \
            REQRO_OPERATOR_ELEVATION_GRANTED_AT="${{ parameters.elevationGrantedAt }}" \
            REQRO_OPERATOR_ELEVATION_EXPIRES_AT="${{ parameters.elevationExpiresAt }}" \
            REQRO_OPERATOR_RUNNER_IDENTITY="$(operatorRunnerIdentity)" \
            REQRO_OPERATOR_RUNNER_PLATFORM=azure-devops \
            REQRO_OPERATOR_TRUSTED_RUNNER="$(operatorTrustedRunner)" \
            REQRO_OPERATOR_JOB_RUN_ID="$(Build.BuildId)" \
            REQRO_OPERATOR_COMMIT_SHA="$(Build.SourceVersion)" \
            REQRO_OPERATOR_IMAGE_DIGEST="${digest}" \
            REQRO_OPERATOR_NETWORK_PROFILE="${{ parameters.networkProfile }}" \
            REQRO_OPERATOR_AUDIT_SINK=stream \
            REQRO_OPERATOR_ORGANIZATION_ID="${{ parameters.organizationId }}" \
            REQRO_OPERATOR_HOSTNAME="${{ parameters.hostname }}" \
            REQRO_OPERATOR_ROLE="${{ parameters.domainRole }}" \
            REQRO_OPERATOR_EXPECTED_REVISION="${{ parameters.expectedRevision }}" \
            REQRO_OPERATOR_APPROVAL_ID="${{ parameters.approvalId }}" \
            REQRO_OPERATOR_REASON="${{ parameters.reason }}" \
            REQRO_OPERATOR_TICKET="${{ parameters.ticket }}" \
            REQRO_OPERATOR_CORRELATION_ID="$(correlationId)" \
            REQRO_OPERATOR_REQUEST_DIGEST="${{ parameters.requestArtifactDigest }}" \
            ${REQRO_REQUEST_ARTIFACT_ENV}

        # DATABASE_URL is injected by the deployment from the secret-free
        # Entra path: the host and database name only, with the managed
        # identity supplying the token inside the container. It is set
        # through the ACI environment by infrastructure, never printed here.

        # Captured as well as streamed, so a request invocation can hand the
        # emitted artifact to its publish step. The log carries the operator
        # output and its audit records and no credential: the allowlist
        # sanitizer and the audit payload check both refuse one.
        mkdir -p "$(Pipeline.Workspace)/operator"
        az container logs \
          --resource-group "$(operatorResourceGroup)" \
          --name "${instance}" \
          --follow | tee "$(Pipeline.Workspace)/operator/output.log"

        state=$(az container show \
          --resource-group "$(operatorResourceGroup)" \
          --name "${instance}" \
          --query "containers[0].instanceView.currentState.exitCode" -o tsv)
        az container delete \
          --resource-group "$(operatorResourceGroup)" \
          --name "${instance}" --yes >/dev/null
        exit "${state}"
    timeoutInMinutes: 15
